name: build

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
    MKN_KUL_GIT_CO: --depth 3 # is added to git clone calls
    MKN_LIB_LINK_LIB: 1
    KLOG: 2

jobs:
  ubuntu:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        python-version: ['3.11', '3.12']
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        architecture: x64
    - run: |
        curl -Lo mkn https://github.com/mkn/mkn/releases/download/latest/mkn_nix
        chmod +x mkn
        export PATH="$PWD:$PATH"
        python3 -m pip install pip -U
        python3 -m pip install wheel -U
        python3 -m pip install -r res/pip_deps.txt -U
        ./mkn -v
        ./mkn build -p tick -dta "-fPIC"
        ./mkn clean build -dStO 2 -p py -tx res/mkn/linux
        ./sh/test_setup.sh
        ./mkn clean build test -Otx res/mkn/linux
        python3 test/asaga_sparse.py

  macos:
    name: Python ${{ matrix.python-version }}
    runs-on: macos-latest

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        python-version: ['3.11', '3.12']
    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        architecture: x64

    - run: |
        curl -Lo mkn https://github.com/mkn/mkn/releases/download/latest/mkn_arm_osx
        chmod +x mkn
        export PATH="$PWD:$PATH"
        python3 -m pip install pip -U
        python3 -m pip install wheel -U
        python3 -m pip install -r res/pip_deps.txt -U
        ./mkn -v
        ./mkn build -p tick -dta "-fPIC -std=c++20"
        ./mkn clean build -dStO 2 -p py -tx res/mkn/osx -a -std=c++20
        ./sh/test_setup.sh
        ./mkn clean build test -Otx res/mkn/osx -a -std=c++20
        python3 test/asaga_sparse.py

  windows:
    name: Python ${{ matrix.python-version }}
    runs-on: windows-latest

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        python-version: ['3.11', '3.12']
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        architecture: x64

    - run: bash -c "rm /bin/link" # interferes with cl/link.exe
    - uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: amd64
    - shell: bash
      env:
        MKN_CL_PREFERRED: 1
      run: |
        curl -Lo mkn.exe https://github.com/mkn/mkn/releases/download/latest/mkn.exe
        (cd $(dirname $(which python)); cp python.exe python3.exe)
        python3 -m pip install pip -U
        python3 -m pip install wheel -U
        python3 -m pip install -r res/pip_deps.txt -U
        ./mkn -v
        ./mkn build -p tick -dta "-EHsc -std:c++20"
        ./mkn clean build -dStO 2 -p py -a "-EHsc -std:c++20"
        ./sh/test_setup.sh
        ./mkn clean build test -Oa "-EHsc -std:c++20"
        python3 test/asaga_sparse.py
